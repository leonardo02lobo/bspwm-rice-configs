;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;
;; MODIFICADO - Agregados módulos CPU, RAM, WiFi, Batería
;; Versión con texto simple para máxima compatibilidad

;; Global WM Settings

[global/wm]
margin-bottom = 0
margin-top = 0

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; File Inclusion
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/catppuccin-colors.ini

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Bar Settings

[bar/main]
monitor = ${env:MONITOR:}
monitor-fallback =
monitor-strict = false
bottom = true
fixed-center = true
width = 17%
height = 60
offset-x = 20
offset-y = 20
background = ${color.bg}
foreground = ${color.fg}
radius-top = 10.0
radius-bottom = 10.0
line-size = 2
line-color = ${color.ac}
border-bottom-size = 0
border-color = ${color.ac}
padding = 2
module-margin-left = 1
module-margin-right = 1

font-0 = "Iosevka Nerd Font:size=13;3"
font-1 = "Iosevka Nerd Font:bold:size=24;2"
font-2 = "Iosevka Nerd Font:size=22;6"
font-3 = "Source Code Pro:size=10;3"
font-5 = "Helvetica Rounded:style=Bold:size=10.5;3"
font-4 = "Montserrat Medium:style=Medium:size=12;3"
font-6 = "Hurmit Nerd Font Mono:style=medium:pixelsize=17;3"
font-7 = "Hack Nerd Font Mono:size=20;6"

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[bar/primary]
inherit = bar/main
offset-x = 96.9%
offset-y = 15
width = 2.5%
height = 40
bottom = false
padding = 0
module-margin-left = 0
module-margin-right = 0
background = #14131c
foreground = #e51d0b
modules-center = sysmenu
wm-restack = bspwm
cursor-click = pointer

[bar/ethernet_status]
inherit = bar/main
width = 10%
height = 33
offset-x = 4%
offset-y = 19
background = #242330
foreground = #ffffff
bottom = false
padding = 1
module-margin-left = 0
module-margin-right = 0
modules-center = ethernet_status 
wm-restack = bspwm
cursor-click = pointer

[bar/vpn_status]
inherit = bar/main
width = 10%
height = 33
offset-x = 14.4%
offset-y = 19
background = #242330
foreground = #ffffff
bottom = false
padding = 1
module-margin-left = 0
module-margin-right = 0
modules-center = vpn_status
wm-restack = bspwm
cursor-click = pointer

[bar/target_to_hack]
inherit = bar/main
width = 15.8%
height = 33
offset-x = 80.7%
offset-y = 19
background = #242330
foreground = #ffffff
bottom = false
padding = 1
module-margin-left = 0
module-margin-right = 0
modules-center = target_to_hack
wm-restack = bspwm
cursor-click = pointer

[bar/updates]
inherit = bar/main
width = 5%
height = 33
offset-x = 64.7%
offset-y = 19
background = #242330
foreground = #ffffff
bottom = false
padding = 1
module-margin-left = 0
module-margin-right = 0
modules-center = update results 
wm-restack = bspwm
cursor-click = pointer

;; BARRA PRINCIPAL - MODIFICADA CON CPU, RAM, WIFI, BATERÍA
[bar/principal_bar]
enable-ipc = true
wm-name = log
inherit = bar/main
width = 99.4%
height = 48
offset-x = 0.4%
offset-y = 12
background = #14131c
foreground = #ffffff
bottom = false
padding = 1
module-margin-left = 1
module-margin-right = 1
modules-left = cpu sep2 memory sep2 wlan sep2 bat volume
modules-center = principal_bar
modules-right = datetime sep2 calendar-mod
wm-restack = bspwm
cursor-click = pointer

[bar/date]
inherit = bar/main
width = 10%
height = 33
offset-x = 70.2%
offset-y = 19
background = #242330
foreground = #ffffff
bottom = false
padding = 1
module-margin-left = 0
module-margin-right = 0
modules-center = calendar-mod datetime 
wm-restack = bspwm
cursor-click = pointer

[bar/log]
inherit = bar/main
width = 2.5%
height = 40
offset-x = 1%
offset-y = 15
bottom = false
foreground = #16b290
background = #14131c
padding = 0
modules-center = my-text-label
wm-restack = bspwm
cursor-click = pointer

[bar/top]
inherit = bar/main
width = 6%
height = 40
offset-x = 90.5%
offset-y = 15
bottom = false
font-0 = "Iosevka Nerd Font:size=12;3"
background = #14131c
padding = 1
module-margin-left = 1
module-margin-right = 1
modules-center = volume bat_status
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

separator =
spacing = 0
dim-value = 1.0
wm-name = openbox
locale = 
tray-position = none
tray-detached = false
tray-maxsize = 16
tray-transparent = false
tray-background = ${color.bg}
tray-offset-x = 0
tray-offset-y = 0
tray-padding = 0
tray-scale = 1.0
wm-restack = bspwm
enable-ipc = true
click-left = 
click-middle = 
click-right =
scroll-up =
scroll-down =
double-click-left =
double-click-middle =
double-click-right =
cursor-click = 
cursor-scroll = 

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Application Settings

[settings]
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;;
;;	    __  ___          __      __         
;;	   /  |/  /___  ____/ /_  __/ /__  _____
;;	  / /|_/ / __ \/ __  / / / / / _ \/ ___/
;;	 / /  / / /_/ / /_/ / /_/ / /  __(__  ) 
;;	/_/  /_/\____/\__,_/\__,_/_/\___/____/  
;;
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/my-text-label]
type = custom/text
format = "" 
click-left = ~/.config/bspwm/scripts/kitty.window.float --width "420" --height "550" --offset-x "-738" --offset-y "-191" --cmd "$HOME/.config/bspwm/scripts/sysfetch" 
cursor-click = wait

[module/sysmenu]
type = custom/text
format = "襤"
click-left = ~/.config/polybar/scripts/powermenu_alt/powermenu.sh

[module/ethernet_status]
type = custom/script
exec = ~/.config/bspwm/scripts/ethernet_status --polybar
click-left = ~/.config/bspwm/scripts/ethernet_status --normal | xargs -I {} bash -c 'echo -n {} | xclip -sel clip && notify-send -t 1700 "Se ha copiado a la clipboard: {}"'
interval = 2

[module/principal_bar]
type = custom/script
exec = echo "AutoBSPWM"
click-left = bspc desktop -f ^1

[module/vpn_status]
type = custom/script
exec = ~/.config/bspwm/scripts/vpn_status --polybar 
click-left = ~/.config/bspwm/scripts/vpn_status --normal | xargs -I {} bash -c 'echo -n {} | xclip -sel clip && notify-send -t 1700 "Se ha copiado a la clipboard: {}"'
interval = 2 

[module/datetime]
type = custom/script
exec = ~/.config/bspwm/scripts/calendar.sh
interval = 1
label-foreground = ${catppuccin-mocha.text}

[module/update]
type = custom/text 
format = "%{F#1bbf3e}UPD%{u-}" 
click-left = ~/.config/bspwm/scripts/kitty.window.float --width "450" --height "700" --offset-x "510" --offset-y "-120" --cmd "$HOME/.config/bspwm/scripts/checkupdates.debian.sh"

[module/results]
type = custom/script
exec = ~/.config/bspwm/scripts/results.sh 
interval = 1 

[module/calendar-mod]
type = custom/text
format = "%{F#ffffff}CAL%{u-}"
click-left = eww -c ~/.config/eww open --toggle date  
click-right = eww -c ~/.config/eww open --toggle date
cursor-click = pointer

[module/target_to_hack]
type = custom/script
exec = ~/.config/bspwm/scripts/target_to_hack --polybar
interval = 2
click-left = ~/.config/bspwm/scripts/target_to_hack --normal | xargs -I {} bash -c 'echo -n {} | xclip -sel clip && notify-send -t 1700 "Se ha copiado a la clipboard: {}"'

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; MÓDULOS NUEVOS - CPU, RAM, WiFi, Batería, Volumen
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/sep2]
type = custom/text
format = "|"
format-foreground = #555555

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = CPU: %percentage%%
format-foreground = #a3be8c

[module/memory]
type = internal/memory
interval = 2
format = <label>
label = RAM: %percentage_used%%
format-foreground = #ebcb8b

[module/wlan]
type = internal/network
interface = wlan0
interval = 3.0
click-left = eww -c ~/.config/eww open --toggle wifi
cursor-click = pointer

format-connected = <label-connected>
label-connected = WiFi: %essid%
label-connected-foreground = #a3be8c

format-disconnected = <label-disconnected>
label-disconnected = WiFi: Off
label-disconnected-foreground = #bf616a

[module/bat]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 98
time-format = %H:%M
poll-interval = 5

format-charging = <label-charging>
label-charging = CHG: %percentage%%
label-charging-foreground = #ebcb8b

format-discharging = <label-discharging>
label-discharging = BAT: %percentage%%
label-discharging-foreground = #a3be8c

format-full = <label-full>
label-full = BAT: Full
label-full-foreground = #a3be8c

format-low = <label-low>
label-low = LOW: %percentage%%
label-low-foreground = #bf616a
low-at = 20

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; MÓDULO DE VOLUMEN CON ICONOS Y CONTROLES
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/volume]
type = internal/alsa
master-soundcard = default
interval = 1

; Formato con iconos Nerd Font
format-volume = <ramp-volume> <label-volume>
format-volume-foreground = #d8dee9

label-volume = %percentage%%

; Iconos para diferentes niveles
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = #d8dee9

; Estado muteado
format-muted = <label-muted>
format-muted-foreground = #bf616a
label-muted =  MUTE

; Controles con clic y scroll
click-right = amixer set Master toggle
scroll-up = amixer set Master 5%+ unmute
scroll-down = amixer set Master 5%- unmute

[module/bat_status]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 98
poll-interval = 5

format-charging = <label-charging>
label-charging = CHG: %percentage%%
label-charging-foreground = #ebcb8b

format-discharging = <label-discharging>
label-discharging = BAT: %percentage%%
label-discharging-foreground = #a3be8c

format-full = <label-full>
label-full = FULL
label-full-foreground = #a3be8c