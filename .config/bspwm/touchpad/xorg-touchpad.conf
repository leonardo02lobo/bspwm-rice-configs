# Touchpad configuration for libinput
# Place this file in /etc/X11/xorg.conf.d/ as 90-touchpad-libinput.conf
# Then restart Xorg (logout/login) for it to take effect.
#
# To install, run as root:
#   sudo mkdir -p /etc/X11/xorg.conf.d
#   sudo cp ~/.config/bspwm/touchpad/xorg-touchpad.conf /etc/X11/xorg.conf.d/90-touchpad-libinput.conf

Section "InputClass"
    Identifier "touchpad"
    Driver "libinput"
    MatchIsTouchpad "on"

    # Tap once = left click
    Option "Tapping" "on"
    Option "TappingButtonMap" "lmr"
    Option "TappingDrag" "on"
    Option "TappingDragLock" "off"

    # Click behavior:
    # - One finger: left click
    # - Two fingers: right click
    # - Three fingers: middle click
    Option "ClickMethod" "clickfinger"

    # Scroll with two fingers and natural (touchscreen-like) direction
    Option "ScrollMethod" "twofinger"
    Option "NaturalScrolling" "on"

    # Disable touchpad while typing
    Option "DisableWhileTyping" "on"

    # Disable middle-button emulation (we have explicit 3-finger tap)
    Option "MiddleEmulation" "off"

    # Pointer acceleration (0.0 = default; positive faster, negative slower)
    Option "AccelSpeed" "0.0"
EndSection
